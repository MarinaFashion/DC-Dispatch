name: CI

on:
  push:
  pull_request:

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q dc_dispatch
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("dc_dispatch").rglob("*.json"):
              json.loads(path.read_text())
          PY
      - name: Validate form JavaScript
        run: node --check dc_dispatch/dc_dispatch/doctype/dc_dispatch_run/dc_dispatch_run.js
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s dc_dispatch/tests -v
